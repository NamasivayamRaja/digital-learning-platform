# Enterprise RabbitMQ Configuration
# Production-ready settings with monitoring and performance optimizations

# Enable management plugin
management.tcp.port = 15672

# Memory and disk configurations
vm_memory_high_watermark.relative = 0.8
disk_free_limit.relative = 2.0

# Clustering (for future scaling)
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config

# Logging
log.console = true
log.console.level = info
log.file = true
log.file.level = info

# Connection and channel limits
max_connections = 1000
max_channels = 2000

# Message TTL and queue limits
default_vhost_limits.max_queues = 1000
default_vhost_limits.max_connections = 500

# Performance tuning
collect_statistics_interval = 10000

# Dead letter and retry configurations
dead_letter_exchange.type = direct
dead_letter_queue.message_ttl = 300000

# Enable prometheus metrics
prometheus.tcp.port = 15692