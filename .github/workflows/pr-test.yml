# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x
          8.0.x
    - name: Restore dependencies
      run: dotnet restore ./DigitalLearningPlatform.sln
    - name: Build
      run: dotnet build ./DigitalLearningPlatform.sln --no-restore
    - name: List test projects
      run: find ./tests -name '*.csproj' -type f
    - name: List discovered tests    
      run: dotnet test .tests/Services/UserService/IntegrationTests/DigitalLearningPlatform.Services.UserService.IntegrationTests.csproj --configuration Release --list-tests --diag testlog.txt
    - name: Upload Coverage
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-reports
        path: |
          tests/**/TestResults/**/coverage.cobertura.xml
    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      with: 
        name: test-results
        path: |
          tests/**/TestResults/**/*.trx
