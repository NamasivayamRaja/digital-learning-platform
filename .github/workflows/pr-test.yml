# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x
          8.0.x
    - name: Restore dependencies
      run: dotnet restore ./DigitalLearningPlatform.sln
    - name: Build
      run: dotnet build ./DigitalLearningPlatform.sln --no-restore
    - name: List test projects
      run: find ./tests -name '*.csproj' -type f
    - name: Print test project and run test
      run: |
       ls -l ./tests/Services/UserService/UnitTests/
       cat ./tests/Services/UserService/UnitTests/DigitalLearningPlatform.Services.UserService.UnitTests.csproj
       dotnet test ./tests/Services/UserService/UnitTests/DigitalLearningPlatform.Services.UserService.UnitTests.csproj --no-build --configuration Release --verbosity normal  
    - name: Run tests and collect coverage
      run: |
        find ./tests -name '*.csproj' -type f | while read proj; do
          echo "Testing $proj"
          dotnet test "$proj" \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory "$(dirname "$proj")/TestResults" \
            --logger "trx;LogFileName=test-results.trx"
        done
    - name: Upload Coverage
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-reports
        path: |
          tests/**/TestResults/**/coverage.cobertura.xml
    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      with: 
        name: test-results
        path: |
          tests/**/TestResults/**/*.trx
