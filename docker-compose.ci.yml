services:
  sqlserver-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: digital-learning-sqlserver-test
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=DEVELOPER
      - SA_PASSWORD=Password@1
    ports:
      - "1434:1433"
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Password@1", "-Q", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:15-alpine
    container_name: digital-learning-postgres-test
    environment:
      POSTGRES_USER: dl_user
      POSTGRES_PASSWORD: dl_pass
      POSTGRES_DB: digital_learning_content_test
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dl_user -d digital_learning_content_test" ]
      interval: 10s
      timeout: 5s
      retries: 5
